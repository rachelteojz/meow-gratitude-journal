<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background circle butter yellow -->
  <circle cx="256" cy="256" r="256" fill="#fff7c0"/>
  <!-- Cat body -->
  <ellipse cx="256" cy="320" rx="125" ry="105" fill="#1a1a1a"/>
  <!-- White belly -->
  <ellipse cx="256" cy="340" rx="65" ry="72" fill="#f5f5f0"/>
  <!-- Cat head -->
  <circle cx="256" cy="210" r="112" fill="#1a1a1a"/>
  <!-- White face/chest bib -->
  <ellipse cx="256" cy="228" rx="52" ry="58" fill="#f5f5f0"/>
  <!-- Ears -->
  <polygon points="148,128 108,42 198,108" fill="#1a1a1a"/>
  <polygon points="364,128 404,42 314,108" fill="#1a1a1a"/>
  <!-- Ear pink -->
  <polygon points="152,122 120,55 194,106" fill="#e8b0b8"/>
  <polygon points="360,122 392,55 318,106" fill="#e8b0b8"/>
  <!-- Eyes amber/gold -->
  <ellipse cx="210" cy="198" rx="27" ry="24" fill="#d4900a"/>
  <ellipse cx="302" cy="198" rx="27" ry="24" fill="#d4900a"/>
  <ellipse cx="214" cy="198" rx="14" ry="19" fill="#111"/>
  <ellipse cx="306" cy="198" rx="14" ry="19" fill="#111"/>
  <circle cx="205" cy="191" r="6" fill="white"/>
  <circle cx="297" cy="191" r="6" fill="white"/>
  <!-- Nose -->
  <ellipse cx="256" cy="228" rx="13" ry="9" fill="#e8a090"/>
  <!-- Mouth -->
  <path d="M242 238 Q256 253 270 238" stroke="#c47a5a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Whiskers white on dark face -->
  <line x1="75" y1="218" x2="220" y2="228" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
  <line x1="75" y1="240" x2="220" y2="236" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
  <line x1="437" y1="218" x2="292" y2="228" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
  <line x1="437" y1="240" x2="292" y2="236" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
  <!-- White paws at bottom -->
  <ellipse cx="200" cy="415" rx="32" ry="18" fill="#f5f5f0"/>
  <ellipse cx="312" cy="415" rx="32" ry="18" fill="#f5f5f0"/>
  <!-- Tail black with white tip -->
  <path d="M375 375 Q448 318 428 232 Q422 205 396 216" stroke="#1a1a1a" stroke-width="30" fill="none" stroke-linecap="round"/>
  <ellipse cx="394" cy="218" rx="16" ry="13" fill="#f5f5f0"/>
  <!-- Bow tie (dapper tuxedo detail) -->
  <polygon points="238,268 256,278 238,288" fill="#c8a800"/>
  <polygon points="274,268 256,278 274,288" fill="#c8a800"/>
  <circle cx="256" cy="278" r="6" fill="#fff7c0"/>
</svg>
